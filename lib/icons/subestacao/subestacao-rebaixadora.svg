<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="100%" height="100%" fill="none">
  <!-- Terminal condutor esquerdo (termina exatamente na borda do círculo x=44) -->
  <line x1="16" y1="40" x2="44" y2="40" stroke="currentColor" stroke-width="6" stroke-linecap="butt"/>
  
  <!-- Círculos entrelaçados -->
  <circle cx="66" cy="40" r="22" stroke="currentColor" stroke-width="6"/>
  <circle cx="94" cy="40" r="22" stroke="currentColor" stroke-width="6"/>
  
  <!-- Terminal condutor direito (inicia exatamente na borda do círculo x=116) -->
  <line x1="116" y1="40" x2="144" y2="40" stroke="currentColor" stroke-width="6" stroke-linecap="butt"/>
</svg>
