<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Metade diagonal inferior preenchida -->
  <polygon points="28 28, 72 72, 28 72" fill="currentColor"/>

  <!-- Terminal de entrada esquerdo -->
  <line x1="5" y1="50" x2="28" y2="50" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Contorno do quadrado -->
  <rect x="28" y="28" width="44" height="44" stroke="currentColor" stroke-width="5.5" stroke-linejoin="miter"/>

  <!-- Terminal de saída direito -->
  <line x1="72" y1="50" x2="85" y2="50" stroke="currentColor" stroke-width="5.5" stroke-linecap="butt"/>

  <!-- Seta indicadora à direita -->
  <polygon points="82 40, 97 50, 82 60" fill="currentColor"/>
</svg>
