<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%" fill="none">
  <!-- Metade diagonal inferior preenchida -->
  <polygon points="35 25, 65 55, 35 55" fill="currentColor"/>

  <!-- Terminal de entrada esquerdo -->
  <line x1="10" y1="40" x2="35" y2="40" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Contorno do quadrado -->
  <rect x="35" y="25" width="30" height="30" stroke="currentColor" stroke-width="3.5" stroke-linejoin="miter"/>

  <!-- Terminal de saída direito -->
  <line x1="65" y1="40" x2="82" y2="40" stroke="currentColor" stroke-width="3.5" stroke-linecap="butt"/>

  <!-- Seta indicadora à direita -->
  <polygon points="80 33, 93 40, 80 47" fill="currentColor"/>
</svg>
