<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Seta diagonal inferior (para antes do círculo na borda inferior esquerda) -->
  <line x1="22" y1="78" x2="31" y2="69" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Seta diagonal superior com ponteira (sai da borda superior direita) -->
  <line x1="69" y1="31" x2="80" y2="20" stroke="currentColor" stroke-width="4.5" stroke-linecap="butt"/>
  <polygon points="76 13, 89 11, 87 24" fill="currentColor"/>
  
  <!-- Círculo contorno -->
  <circle cx="50" cy="50" r="27" stroke="currentColor" stroke-width="4.5"/>
  
  <!-- Letra R centralizada -->
  <text x="50" y="61" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="currentColor">R</text>
</svg>
