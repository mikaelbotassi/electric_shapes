<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Seta diagonal inferior -->
  <line x1="14" y1="86" x2="26" y2="74" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
  
  <!-- Seta diagonal superior com ponteira -->
  <line x1="74" y1="26" x2="86" y2="14" stroke="currentColor" stroke-width="5.5" stroke-linecap="butt"/>
  <polygon points="80 5, 97 3, 95 20" fill="currentColor"/>

  <defs>
    <!-- Metade esquerda -->
    <clipPath id="clip-left">
      <rect x="0" y="0" width="50" height="100"/>
    </clipPath>
    <!-- Metade direita -->
    <clipPath id="clip-right">
      <rect x="50" y="0" width="50" height="100"/>
    </clipPath>
    
    <!-- Máscara para vazar o R na metade direita -->
    <mask id="mask-right">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <path d="M 40 33 H 53 C 58.5 33 62 36 62 40.5 C 62 45 58.5 48 53 48 H 45.5 V 67 H 40 V 33 Z M 45.5 38 V 43.5 H 52.5 C 55 43.5 56.5 42.3 56.5 40.5 C 56.5 38.7 55 38 52.5 38 H 45.5 Z M 52 48 L 63 67 H 56.5 L 46.5 49.5 H 52 Z" fill="black" clip-path="url(#clip-right)"/>
    </mask>
  </defs>

  <!-- Metade direita preenchida vazando o R -->
  <path d="M 50 15 A 35 35 0 0 1 50 85 Z" fill="currentColor" mask="url(#mask-right)"/>

  <!-- Contorno do círculo -->
  <circle cx="50" cy="50" r="35" stroke="currentColor" stroke-width="5.5"/>

  <!-- Letra R na metade esquerda -->
  <path d="M 40 33 H 53 C 58.5 33 62 36 62 40.5 C 62 45 58.5 48 53 48 H 45.5 V 67 H 40 V 33 Z M 45.5 38 V 43.5 H 52.5 C 55 43.5 56.5 42.3 56.5 40.5 C 56.5 38.7 55 38 52.5 38 H 45.5 Z M 52 48 L 63 67 H 56.5 L 46.5 49.5 H 52 Z" fill="currentColor" clip-path="url(#clip-left)"/>
</svg>
